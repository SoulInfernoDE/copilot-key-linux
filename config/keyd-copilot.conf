# keyd configuration for the Copilot key
# -> install to /etc/keyd/copilot.conf, then: sudo keyd reload
#
# Most Copilot keys (Minisforum AI X1 Pro included) do not send a key of their
# own: the firmware sends the chord LeftMeta + LeftShift + F23. keyd intercepts
# it on the evdev layer - before X11 or Wayland see it - and emits a rare chord
# that the desktop can bind to a command.
#
# Verify what your machine actually sends:   ./detect-key.sh

[ids]
# All keyboards. Restrict this to a single device id (as printed by
# `sudo keyd monitor`) if the chord collides with another keyboard.
*

[main]
# Copilot key -> Ctrl+Alt+Shift+F12, bound to copilot-key in the desktop settings.
leftmeta+leftshift+f23 = C-A-S-f12

# --- alternative firmware behaviours ----------------------------------------
# Uncomment whichever line matches the output of detect-key.sh.
#
# Key reported as a plain F23:
# f23 = C-A-S-f12
#
# Key reported as KEY_ASSISTANT (newer kernels, some OEM firmware):
# assistant = C-A-S-f12
#
# Key reported as Meta+Shift+F20 (a few BIOS revisions):
# leftmeta+leftshift+f20 = C-A-S-f12
