# copilot-key - configuration (German labels)
# Installed instead of config.toml when the locale is German.
# Copied to ~/.config/copilot-key/config.toml during installation.
# Changes take effect on the next key press - nothing needs restarting.
#
# Everything in here can be clicked together instead:  copilot-key configure

[general]
# Sounds on or off.
sounds = true

# Cue volume, 0.0 to 1.0.
volume = 0.7

# Sound theme: "auto" takes the one the skin names, otherwise a directory
# name from sounds/ - "default" (glass bells), "crystal", "felt", or your
# own. docs/sound-themes.md explains how to make one.
sound_theme = "auto"

# Time window for the double press, in milliseconds.
double_press_ms = 450

# What a single press does:
#   toggle_or_menu : toggle the primary action's window, open the menu if there is none
#   toggle         : always toggle (starts the app when no window exists)
#   menu           : always open the menu
single_press = "toggle_or_menu"

# Heading of the menu.
menu_title = "Was darf es sein?"

# Close the menu as soon as it loses focus (e.g. a click next to it).
# Set to false if the menu disappears too early on your desktop.
close_on_focus_loss = true

# Menu style: "radial" (overlay wheel) or "list" (plain vertical list).
menu_style = "radial"

# Skin of the wheel: a file name from skins/, without the .toml.
# Shipped: terracotta, aurora, mint. Writing your own: docs/skins.md.
menu_skin = "terracotta"

# Put the applications' own icons on the buttons instead of the drawn ones.
# A single button can still be told otherwise - see icon_source below.
use_app_icons = false

# How far the desktop behind the menu is dimmed, 0.0 to 1.0.
dim_opacity = 0.62

# Theme of the editor window: "auto" follows the desktop, or "dark" / "light".
editor_theme = "auto"


# --- sounds -----------------------------------------------------------------
# One file per cue, overruling the sound theme for just that cue. A bare file
# name is looked up in ~/.config/copilot-key/sounds/, "~/..." and absolute
# paths work as well, and "none" mutes that one cue. The editor's Sounds tab
# fills this in - and copies the file there, so tidying Downloads breaks nothing.
#
# Cues: menu-open, menu-dismiss, launch, toggle-show, toggle-hide, error,
#       drag-lift, drag-drop
[sounds]


# --- actions ----------------------------------------------------------------
# Order = order in the menu = number keys 1-9.
#
# command understands five placeholders:
#   @claude-desktop   looks for an installed Claude desktop app,
#                     falls back to claude.ai in the browser
#   @terminal <cmd>   runs <cmd> in a new terminal window
#   @browser <url>    opens <url> in the default application
#   @configure        opens the graphical menu editor
#   @edit-config      opens this file in the default editor
# Anything else runs as an ordinary command line.
#
# icon         : window, terminal, globe, gear, chat, folder, power, pencil,
#                sparkle - the symbols the menu draws itself
# app_icon     : the application's own icon, as the icon theme calls it; the
#                editor and the wheel's edit mode fill this in
# icon_source  : "app" or "vector", overruling use_app_icons for this button
# window_class : substring of the window's WM_CLASS (used for toggling).
#                Find yours with:  wmctrl -lx
# primary      : exactly one action should be primary = true - that is the one
#                a single key press toggles.

[[actions]]
id = "claude-desktop"
label = "Claude Desktop"
subtitle = "Fenster in den Vordergrund holen oder starten"
command = "@claude-desktop"
icon = "window"
window_class = "claude"
primary = true

[[actions]]
id = "claude-code"
label = "Claude Code"
subtitle = "Neues Terminal mit laufender Claude-Code-Sitzung"
command = "@terminal claude"
icon = "terminal"
window_class = ""
primary = false

[[actions]]
id = "claude-web"
label = "claude.ai im Browser"
subtitle = "Weboberfläche in der Standardanwendung öffnen"
command = "@browser https://claude.ai"
icon = "globe"
window_class = ""
primary = false

[[actions]]
id = "settings"
label = "Menü einrichten"
subtitle = "Einträge und Verhalten in einem Fenster bearbeiten"
command = "@configure"
icon = "gear"
window_class = ""
primary = false
